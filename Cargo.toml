[package]
name = "dsh-pet-indesktop-rs"
version = "0.1.0"
edition = "2021"
description = "Rust 重构版桌面宠物（原项目 MerZlin/dsh-pet-indesktop），蓝色大肥鱼跨 Windows/Linux/macOS"
license = "MIT"
repository = "https://github.com/entropy356/dsh-pet-indesktop-rs"
keywords = ["desktop-pet", "desktop", "pet", "winit"]

[dependencies]
# 配置层（issue #3）：serde + serde_json，JSON 与原项目 config.json 兼容。
# toml 迁移另议，见仓库 README 技术选型。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 窗口系统（issue #9）：winit 仅在 window 模块（src/window/）使用，
# 提供 WinitBackend 与事件循环接线；纯逻辑模块（physics/animation/config）
# 禁止引用（CI scripts/check-arch.sh 红线 R1 守护）。
winit = "0.30"

[dev-dependencies]
# 属性测试（仅测试期依赖，不进入运行时依赖图，见 issue #1 验收标准）
proptest = "1"

[profile.release]
lto = true
strip = true
