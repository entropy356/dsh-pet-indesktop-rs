name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN 最小权限（本工作流只需读代码）
permissions:
  contents: read

# 同一 PR 连续 push 只跑最新一次；main 上的连续合并不互相取消
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: build + test + clippy + fmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # GUI 项目（winit 事件循环）测试有挂死风险，不让 job 占满 runner 6h 上限
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 工具链钉死：门禁版本不能是移动目标（与 rust-toolchain.toml 一致；
      # SPEC §1.6 定 CI 为机械事实源，事实源自身须可复现）
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --all-targets

      - name: test
        run: cargo test

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: fmt
        run: cargo fmt --check

  arch:
    name: architecture red lines
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: check architecture red lines
        run: bash scripts/check-arch.sh
