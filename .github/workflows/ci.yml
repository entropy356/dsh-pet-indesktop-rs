name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build + test + clippy + fmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --all-targets

      - name: test
        run: cargo test

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: fmt
        run: cargo fmt --check

  arch:
    name: architecture red lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check architecture red lines
        run: bash scripts/check-arch.sh
